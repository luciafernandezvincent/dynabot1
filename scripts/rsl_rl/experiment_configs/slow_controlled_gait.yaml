# Slow, controlled gait - higher steps with proper ground contact
# Run with: python scripts/rsl_rl/train_delay.py --task=Dyna1-Flat-v0 --headless --num_envs=4096 --name=slow_controlled --experiment_config=scripts/rsl_rl/experiment_configs/slow_controlled_gait.yaml

env:
  rewards:
    track_lin_vel_xy_exp:
      weight: 0.5  # Reduced from 1.0 - less pressure to go fast
    track_ang_vel_z_exp:
      weight: 0.5
    lin_vel_z_l2:
      weight: -0.5  # Reduced from -2.0 - allow more vertical movement
    ang_vel_xy_l2:
      weight: -0.05
    dof_torques_l2:
      weight: -1.0e-5
    dof_acc_l2:
      weight: -1.0e-6  # Reduced from -2.5e-7 - smoother movements
    action_rate_l2:
      weight: -0.5  # Increased from -0.1 - very smooth, slow actions
    feet_air_time:
      weight: 0.3  # Moderate from 0.22
    undesired_contacts:
      weight: -1.0
    flat_orientation_l2:
      weight: -5.0e-4  # Increased from -1.0e-4 - more stable posture
    dof_pos_limits:
      weight: 0.0
  episode_length_s: 20.0

agent:
  num_steps_per_env: 24
  max_iterations: 1500
  save_interval: 50
  empirical_normalization: false
  algorithm:
    value_loss_coef: 1.0
    use_clipped_value_loss: true
    clip_param: 0.2
    entropy_coef: 0.005
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 5.0e-4  # Reduced from 1.0e-3 - slower learning
    schedule: "adaptive"
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0
  policy:
    actor_hidden_dims: [512, 256, 128]
    critic_hidden_dims: [512, 256, 128]
    activation: "elu"
    init_noise_std: 1.0
