# CAMPEON VIGENTE para la segunda tanda de investigacion delay5 (generado a mano el 27/08 a partir
# del resultado de research/runs/exp_053_combo_epochs_delay5/config.resolved.yaml, el mejor score
# de la tanda anterior: 0.5467). Se le sacaron max_iterations/seed/experiment_name (los fija el
# runner). No editar a mano salvo para actualizar a un nuevo campeon.
env:
  episode_length_s: 20.0
  rewards:
    track_lin_vel_xy_exp:
      weight: 1.5
    track_ang_vel_z_exp:
      weight: 0.75
    lin_vel_z_l2:
      weight: -2.0
    ang_vel_xy_l2:
      weight: -0.05
    dof_torques_l2:
      weight: -2.5e-05
    dof_acc_l2:
      weight: -2.5e-07
    action_rate_l2:
      weight: -0.1
    feet_air_time:
      weight: 0.5
      params:
        threshold: 0.12
    undesired_contacts:
      weight: -1.0
    flat_orientation_l2:
      weight: -5.0
    dof_pos_limits:
      weight: 0.0
    joint_deviation:
      weight: -0.15
    knee_clearance:
      weight: 0.5
      params:
        min_height: 0.11
        std: 0.005
        tanh_mult: 2.0
agent:
  num_steps_per_env: 24
  save_interval: 50
  empirical_normalization: false
  algorithm:
    value_loss_coef: 1.0
    use_clipped_value_loss: true
    clip_param: 0.2
    entropy_coef: 0.005
    num_learning_epochs: 8
    num_mini_batches: 4
    learning_rate: 0.001
    schedule: adaptive
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0
  actor:
    hidden_dims: [128, 128, 128]
    activation: elu
  critic:
    hidden_dims: [128, 128, 128]
    activation: elu
