# CAMPEON VIGENTE (generado automaticamente, no editar a mano). run_night.py lo actualiza
# solo si un experimento mejora el score.
# Actual: exp_001_clearance_on, score 0.5837 (baseline_ar era 0.4790).

env:
  episode_length_s: 20.0
  rewards:
    track_lin_vel_xy_exp:
      weight: 1.5
    track_ang_vel_z_exp:
      weight: 0.75
    lin_vel_z_l2:
      weight: -2.0
    ang_vel_xy_l2:
      weight: -0.05
    dof_torques_l2:
      weight: -2.5e-05
    dof_acc_l2:
      weight: -2.5e-07
    action_rate_l2:
      weight: -0.1
    feet_air_time:
      weight: 0.5
      params:
        threshold: 0.5
    undesired_contacts:
      weight: -1.0
    flat_orientation_l2:
      weight: -5.0
    dof_pos_limits:
      weight: 0.0
    foot_clearance:
      weight: 0.5
      params:
        target_height: 0.05
agent:
  num_steps_per_env: 24
  save_interval: 50
  empirical_normalization: false
  algorithm:
    value_loss_coef: 1.0
    use_clipped_value_loss: true
    clip_param: 0.2
    entropy_coef: 0.005
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 0.001
    schedule: adaptive
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0
  policy:
    actor_hidden_dims:
    - 128
    - 128
    - 128
    critic_hidden_dims:
    - 128
    - 128
    - 128
    activation: elu
    init_noise_std: 1.0
