# OBJETIVO: swing mas largo (hoy 197 ms con el campeon exp_001).
#
# CORREGIDO tras el resultado de exp_002: bajar el threshold de feet_air_time EMPEORA. Medido:
# swing 197 -> 127 ms, zancada 2.56 -> 3.96 Hz, caidas +56%, score 0.5837 -> 0.4459.
# Razon: el termino nunca cruza a positivo (se queda en -0.0057), y estando en zona negativa un
# threshold mas chico abarata el castigo por pisada, asi que la politica pisa MAS seguido. El
# gradiente va al reves de lo que se esperaba.
#
# Lo que si funciona es foot_clearance: es el unico que estiro el swing (172 -> 197 ms) y ademas
# bajo caidas 87% e impacto 32%. Hipotesis: subir la altura objetivo obliga a un arco mas alto,
# que necesariamente toma mas tiempo -> swing mas largo. Se sube target_height de 5 a 8 cm
# manteniendo el peso, sobre el campeon. feet_air_time queda en su valor de baseline.
env:
  rewards:
    foot_clearance:
      weight: 1.0
      params:
        target_height: 0.08
