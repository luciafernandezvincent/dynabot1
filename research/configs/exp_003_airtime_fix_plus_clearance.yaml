# Combina la correccion del umbral (exp_002) con el despeje activado (exp_001), que es la
# configuracion que deberia dar la mejor zancada si ambas hipotesis son correctas. Se corre
# despues de las dos aisladas para poder atribuir la mejora.
env:
  rewards:
    feet_air_time:
      params:
        threshold: 0.12
    foot_clearance:
      weight: 0.5
      params:
        target_height: 0.05
