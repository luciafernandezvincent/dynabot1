# Hipotesis: combinar despeje con mas tiempo de vuelo. feet_air_time premia duracion y
# foot_clearance premia altura; juntos deberian dar una zancada con forma real en vez de un
# roce rapido contra el piso.
env:
  rewards:
    foot_clearance:
      weight: 1.0
      params:
        target_height: 0.05
    feet_air_time:
      weight: 1.0
