# exp_053 (mejor conocido) con mas epochs todavia (8->10), para ver si sigue mejorando o si 8 ya
# esta cerca del optimo.
env:
  rewards:
    feet_air_time:
      params:
        threshold: 0.12
    joint_deviation:
      weight: -0.15
    knee_clearance:
      weight: 0.5
      params:
        min_height: 0.11
        std: 0.005
        tanh_mult: 2.0
agent:
  algorithm:
    num_learning_epochs: 10
