# Acotar el optimo de num_learning_epochs entre 5 (exp_046) y 8 (exp_053, el mejor) y 10 (exp_054,
# peor). Probar 6.
env:
  rewards:
    feet_air_time:
      params:
        threshold: 0.12
    joint_deviation:
      weight: -0.15
    knee_clearance:
      weight: 0.5
      params:
        min_height: 0.11
        std: 0.005
        tanh_mult: 2.0
agent:
  algorithm:
    num_learning_epochs: 6
