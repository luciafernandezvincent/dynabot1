# Reemplazar joint_deviation generico (todas las juntas) por joint_deviation_shoulder (solo
# hombros, historico exp_019 w=-0.5, el mejor de la familia "postura" sin delay). Hipotesis: el
# arm_link (rodilla) depende mas directamente del angulo del hombro que del resto de las juntas.
env:
  rewards:
    feet_air_time:
      params:
        threshold: 0.12
    joint_deviation:
      weight: 0.0
    joint_deviation_shoulder:
      weight: -0.5
    knee_clearance:
      weight: 0.5
      params:
        min_height: 0.11
        std: 0.005
        tanh_mult: 2.0
