# Mejor combo (exp_040) con knee_clearance mas fuerte: nunca se probo subir el peso de la v2
# (velocidad del segmento, la que funciona) mas alla de 0.5. air_time_variance (exp_042) no
# resolvio la asimetria, asi que se descarta y se vuelve al combo base de exp_040.
env:
  rewards:
    feet_air_time:
      params:
        threshold: 0.12
    joint_deviation:
      weight: -0.1
    knee_clearance:
      weight: 1.5
      params:
        min_height: 0.11
        std: 0.005
        tanh_mult: 2.0
