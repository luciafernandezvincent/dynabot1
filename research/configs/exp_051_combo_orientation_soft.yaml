# exp_046 + aflojar flat_orientation_l2 (-5.0 -> -1.0). Hipotesis: mas libertad de inclinar el
# cuerpo podria darle al robot otra via para mantener el arm_link mas alto, en vez de depender
# solo de la flexion de la pata.
env:
  rewards:
    feet_air_time:
      params:
        threshold: 0.12
    joint_deviation:
      weight: -0.15
    knee_clearance:
      weight: 0.5
      params:
        min_height: 0.11
        std: 0.005
        tanh_mult: 2.0
    flat_orientation_l2:
      weight: -1.0
