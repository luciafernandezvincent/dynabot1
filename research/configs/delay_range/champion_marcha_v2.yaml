# champion_marcha_v2 = exp_423_combo_smooth_nofall (0.5705): la marcha mas suave hacia adelante y 0 caidas.
# = champion_v3 + ang_vel_xy_l2 -0.2 + action_rate_l2 -0.5 + termination_penalty -200.
agent:
  actor:
    hidden_dims:
    - 512
    - 256
    - 128
  algorithm:
    num_learning_epochs: 8
  critic:
    hidden_dims:
    - 512
    - 256
    - 128
env:
  rewards:
    action_rate_l2:
      weight: -0.5
    feet_air_time:
      weight: 4.0
    gait:
      weight: 3.5
    joint_deviation:
      weight: -0.2
    joint_deviation_shoulder:
      weight: -0.5
    knee_clearance:
      params:
        min_height: 0.1
      weight: 0.5
    ang_vel_xy_l2:
      weight: -0.2
    termination_penalty:
      weight: -200.0
