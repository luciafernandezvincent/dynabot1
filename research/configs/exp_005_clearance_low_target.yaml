# Hipotesis: 5 cm puede ser demasiado para las patas de Dyna1 y saturar el termino. Un objetivo
# mas modesto (3 cm) con peso alto podria dar un despegue consistente sin pelearse con el
# seguimiento de velocidad.
env:
  rewards:
    foot_clearance:
      weight: 1.0
      params:
        target_height: 0.03
