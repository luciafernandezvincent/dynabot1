# combo de exp_046 (mejor para knee_clearance) + activar dof_pos_limits (siempre estuvo en 0.0,
# nunca probado bajo delay). Penaliza acercarse a los limites fisicos de la junta, hipotesis:
# podria evitar la flexion extrema que hace bajar tanto el arm_link.
env:
  rewards:
    feet_air_time:
      params:
        threshold: 0.12
    joint_deviation:
      weight: -0.15
    knee_clearance:
      weight: 0.5
      params:
        min_height: 0.11
        std: 0.005
        tanh_mult: 2.0
    dof_pos_limits:
      weight: -1.0
