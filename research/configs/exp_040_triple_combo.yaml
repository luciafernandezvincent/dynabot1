# Combinar los tres factores que funcionaron aislados bajo delay=5: threshold=0.12 (exp_002),
# joint_deviation=-0.1 (exp_032, que combinado con threshold dio el mejor score conocido en
# exp_033) y knee_clearance con std calibrado (exp_039, primer factor que mejora knee_height).
env:
  rewards:
    feet_air_time:
      params:
        threshold: 0.12
    joint_deviation:
      weight: -0.1
    knee_clearance:
      weight: 0.5
      params:
        min_height: 0.11
        std: 0.005
        tanh_mult: 2.0
