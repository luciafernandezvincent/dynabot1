# Hipotesis: la señal de tarea es demasiado debil frente a las penalizaciones (flat_orientation_l2
# vale -5.0 contra un track_lin_vel_xy_exp de 1.5), y por eso la baseline sigue el comando de
# velocidad peor que quedarse quieta. Duplicar el peso de la tarea deberia hacer que caminar
# convenga mas que quedarse parado.
#
# Formato: SOLO el delta respecto de la base. El resto sale de --base (champion.yaml) o del codigo.

env:
  rewards:
    track_lin_vel_xy_exp:
      weight: 3.0
    track_ang_vel_z_exp:
      weight: 1.5
