# exp_046 (mejor para knee_clearance, joint_dev=-0.15) + subir min_height del reward de 0.11 a
# 0.15 (mas ambicioso), ahora que weight/std ya funcionan (exp_039/046), para ver si empuja mas
# alla de la meseta ~0.05-0.07m.
env:
  rewards:
    feet_air_time:
      params:
        threshold: 0.12
    joint_deviation:
      weight: -0.15
    knee_clearance:
      weight: 0.5
      params:
        min_height: 0.15
        std: 0.005
        tanh_mult: 2.0
