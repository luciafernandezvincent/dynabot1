# Combo de lo que deberia dar una caminata elegante, si las hipotesis aisladas resultan positivas
# por separado. CORREGIDO: sin el threshold 0.12 de feet_air_time, que en exp_002 empeoro todo
# (swing 197 -> 127 ms, caidas +56%). feet_air_time queda en su valor de baseline.
env:
  rewards:
    foot_clearance:
      weight: 1.0
      params:
        target_height: 0.05
    gait:
      weight: 5.0
    air_time_variance:
      weight: -1.0
